<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preload" href="./audio.mp3" as="audio" type="audio/mpeg" />
  <title>King Crimson - Larks' Tongues In Aspic Part I</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fffaf2;
      --panel: #fffdf8;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dad7cd;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --active-bg: #e6f4f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(100%, 520px);
      margin: 0 auto;
      text-align: center;
    }
    .cover {
      width: min(72vw, 260px);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      margin: 0 auto 28px;
      display: block;
      border: 1px solid var(--line);
      background: #e9f3ef;
    }
    .cover[hidden] { display: none; }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }
    p {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }
    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover,
    button:focus-visible { background: var(--accent-strong); }
    audio {
      width: 100%;
      margin-top: 18px;
    }
    .hint {
      min-height: 24px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .lyrics-wrap,
    .instrumental-wrap {
      margin-top: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      text-align: left;
    }
    .lyrics-title {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--muted);
    }
    .lyrics {
      max-height: 320px;
      overflow: auto;
      scroll-behavior: smooth;
    }
    .line {
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .line.active {
      background: var(--active-bg);
      color: var(--accent-strong);
      font-weight: 700;
    }
    .instrumental-card {
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--accent-strong);
      background: var(--active-bg);
      line-height: 1.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <img class="cover" src="./cover.jfif" alt="King Crimson - Larks' Tongues In Aspic Part I cover" />
    <h1>King Crimson - Larks' Tongues In Aspic Part I</h1>
    <p>Tap play and stay with the whole piece.</p>
    <button id="playButton" type="button">Play</button>
    <audio id="voice" controls preload="auto">
      <source src="./audio.mp3" type="audio/mpeg" />
      Your browser does not support audio playback.
    </audio>
    <div class="hint" id="hint">If you hear nothing, check that your phone is not muted.</div>
    <section class="instrumental-wrap">
      <div class="instrumental-card">This is an instrumental page. Settle in and listen all the way through.</div>
    </section>
  </main>
  <script>
    const audio = document.querySelector("#voice");
    const button = document.querySelector("#playButton");
    const hint = document.querySelector("#hint");
    const cover = document.querySelector(".cover");

    audio.load();

    cover.addEventListener("error", () => {
      cover.hidden = true;
    });

    async function playVoice() {
      try {
        await audio.play();
        button.textContent = "Playing";
        hint.textContent = "This instrumental page is ready to play.";
      } catch (error) {
        hint.textContent = "The browser needs one more tap on the play button.";
      }
    }

    button.addEventListener("click", playVoice);
    document.addEventListener("click", (event) => {
      if (event.target === button || !audio.paused) return;
      playVoice();
    }, { once: true });


  </script>
</body>
</html>

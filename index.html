<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Songweb</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #faf7f2;
      --ink: #202124;
      --muted: #5f6368;
      --line: #ddd7cd;
      --accent: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      display: block;
      padding: 16px 18px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      text-decoration: none;
      background: #fff;
    }

    a strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Songweb</h1>
    <p>选择一首歌进入对应页面。</p>

    <a href="./01-king-crimson-21st-century-schizoid-man/">
      <strong>01</strong>
      King Crimson - 21st Century Schizoid Man
    </a>

    <a href="./02-king-crimson-epitaph/">
      <strong>02</strong>
      King Crimson - Epitaph
    </a>

    <a href="./03-king-crimson-the-court-of-the-crimson-king/">
      <strong>03</strong>
      King Crimson - The Court Of The Crimson King
    </a>
  </main>
</body>
</html>
